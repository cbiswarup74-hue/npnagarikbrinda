{% extends "base.html" %}

{% block content %}
<style>
    .sub-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2.5rem;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        border: 1px solid #e2e8f0;
    }
    .sub-container h1 {
        color: #0f172a;
        margin-bottom: 0.5rem;
        font-size: 2rem;
        text-align: center;
    }
    .sub-container p {
        color: #64748b;
        text-align: center;
        margin-bottom: 2rem;
    }
    .form-group {
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #334155;
    }
    .form-control, .form-select {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
    }
    .btn-pay {
        width: 100%;
        background-color: #800020; /* Maroon theme for donations */
        color: #ffffff;
        border: none;
        padding: 0.85rem;
        font-size: 1.1rem;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 1rem;
        transition: background 0.2s ease;
    }
    .btn-pay:hover {
        background-color: #5c0017;
    }
</style>

<div class="sub-container">
    <h1>Donation & Special Subscriptions</h1>
    <p>Support Neogi Para Nagarikbrinda's community initiatives, festival funds, or social welfare projects.</p>

    <form id="donationForm" onsubmit="processDonation(event)">
        <div class="form-group">
            <label for="donorName">Full Name</label>
            <input type="text" id="donorName" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="donorPhone">Phone Number</label>
            <input type="tel" id="donorPhone" class="form-control" placeholder="Enter 10-digit mobile number" required>
        </div>

        <div class="form-group">
            <label for="donationType">Contribution Purpose</label>
            <select id="donationType" class="form-select" required>
                <option value="Durga Puja / Festival Fund">Durga Puja / Festival Fund</option>
                <option value="Social Welfare & Medical Relief">Social Welfare & Medical Relief</option>
                <option value="Cultural Program Sponsorship">Cultural Program Sponsorship</option>
                <option value="General Donation">General Donation</option>
            </select>
        </div>

        <div class="form-group">
            <label for="donationAmount">Contribution Amount (₹)</label>
            <input type="number" id="donationAmount" class="form-control" placeholder="Enter amount" min="50" required>
        </div>

        <button type="submit" class="btn-pay">Proceed to Pay Donation</button>
    </form>
</div>

<!-- Razorpay Integration Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
async function processDonation(event) {
    event.preventDefault();
    
    const name = document.getElementById('donorName').value;
    const phone = document.getElementById('donorPhone').value;
    const purpose = document.getElementById('donationType').value;
    const amount = document.getElementById('donationAmount').value;

    try {
        // Step A: Request Order ID from Flask Backend
        const response = await fetch('/create-payment-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: amount })
        });
        const order = await response.json();

        // Step B: Open Razorpay Checkout Modal
        const options = {
            "key": "{{ key_id }}",
            "amount": order.amount,
            "currency": "INR",
            "name": "Neogi Para Nagarikbrinda",
            "description": purpose,
            "order_id": order.id,
            "handler": async function (res) {
                // Step C: Verify payment signature and record in SQLite DB
                const verifyRes = await fetch('/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: res.razorpay_order_id,
                        razorpay_payment_id: res.razorpay_payment_id,
                        razorpay_signature: res.razorpay_signature,
                        name: name,
                        phone: phone,
                        amount: amount,
                        category: purpose
                    })
                });
                const result = await verifyRes.json();
                if (result.status === 'success') {
                    alert('Thank you! Your donation and details have been recorded successfully.');
                    window.location.href = '/';
                } else {
                    alert('Payment verification failed.');
                }
            },
            "prefill": {
                "name": name,
                "contact": phone
            },
            "theme": { "color": "#800020" }
        };

        const rzp = new Razorpay(options);
        rzp.open();
    } catch (err) {
        alert("Failed to initialize payment gateway. Check your API Keys in app.py.");
    }
}
</script>
{% endblock %}
